name: Build MySU Manager

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-manager-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-manager-apk:
    name: Build & Package Manager APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Setup Java Toolchain (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Native mysud Daemons (64-Bit)
        run: |
          cargo ndk --platform 26 --target aarch64-linux-android --target x86_64-linux-android build --release -p mysud

      - name: Setup Keystore Environment
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.MYSU_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.config/mysu"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.config/mysu/mysu.keystore"
          chmod 600 "$HOME/.config/mysu/mysu.keystore"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Manager APK
        id: build_apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.MYSU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.MYSU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.MYSU_KEY_PASSWORD }}
        run: |
          cd manager
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f "$HOME/.config/mysu/mysu.keystore" ]; then
            export KEYSTORE_FILE="$HOME/.config/mysu/mysu.keystore"
            ./gradlew assembleRelease
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Repack APK with 64-Bit mysud Daemons
        env:
          BUILD_TYPE: ${{ steps.build_apk.outputs.build_type }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.MYSU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.MYSU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.MYSU_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            python3 repack_apk.py repack \
              --strip \
              -b release \
              -t release \
              -a arm64-v8a -a x86_64 \
              -K "$HOME/.config/mysu/mysu.keystore" \
              -A "$KEY_ALIAS" \
              -P "$KEYSTORE_PASSWORD" \
              -S "$KEY_PASSWORD"
          else
            # Fall back to standard Android debug keystore
            DEBUG_KS="$HOME/.android/debug.keystore"
            python3 repack_apk.py repack \
              --strip \
              -b debug \
              -t release \
              -a arm64-v8a -a x86_64 \
              -K "$DEBUG_KS" \
              -A "androiddebugkey" \
              -P "android" \
              -S "android"
          fi

      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager
          path: |
            dist/*.apk
